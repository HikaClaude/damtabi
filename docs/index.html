<div id="app">
  <header id="topbar">
    <h1>富山県 ダム貯水率マップ</h1>
    <div id="meta">
      <span id="obs-time">読み込み中…</span>
      <span id="status-summary"></span>
    </div>
    <a id="list-link" href="./dam/">ダム一覧</a>
    <!-- 出典は常時表示。パネルや凡例に隠れないようヘッダ内に置く -->

      出典：<a href="https://www.river.go.jp/kawabou/pcfull/tm" target="_blank" rel="noopener">国土交通省　川の防災情報ホームページ</a>を加工して作成
      ｜ 地図：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>（国土地理院）
    </p>
  </header>

  <main id="map" aria-label="ダムの位置と貯水率の地図"></main>

  <div id="controls">
    <fieldset id="basis-switch">
      <legend>ピンの色</legend>
      <label><input type="radio" name="basis" value="irrigation" checked> 利水貯水率</label>
      <label><input type="radio" name="basis" value="effective"> 有効貯水率</label>
    </fieldset>
    <ul id="legend"></ul>
  </div>

  <aside id="panel" class="is-hidden" aria-live="polite">
    <button id="panel-close" type="button" aria-label="閉じる">×</button>
    <div id="panel-body"></div>
  </aside>
</div>
